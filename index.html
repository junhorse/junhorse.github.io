<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>김준호 / KIMJUNHO — Portfolio</title>
<meta name="description" content="한의학을 공부하면서 필요한 도구는 직접 만드는 한의대생 김준호의 포트폴리오." />
<meta name="theme-color" content="#0d0d0e" />
<meta property="og:title" content="김준호 / KIMJUNHO — Portfolio" />
<meta property="og:description" content="한의학을 공부하면서, 필요한 도구는 직접 만듭니다." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://junhorse.github.io/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0d0e'/%3E%3Ctext x='16' y='23' font-family='Arial Black,sans-serif' font-size='17' font-weight='900' text-anchor='middle' fill='%23ec3327'%3EJ%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="app.js" defer></script>
<script src="vault.js" defer></script>
</head>
<body>

<header class="top">
  <a class="mark" href="#intro" aria-label="맨 위로">KJH</a>
  <span class="top-role" data-bind="role"></span>
  <span class="top-year">Portfolio <b>2026</b></span>
</header>

<section class="stage" id="intro" data-label="Intro">
  <h1 class="giant" aria-label="Portfolio"><span>PORT</span><span>FOLIO</span></h1>
  <figure class="figure" id="figure"></figure>
  <div class="hello">
    <p class="hi">Hi, I'm</p>
    <h2 class="name"><span class="kr" data-bind="nameKr"></span><span class="slash">/</span><span class="en" data-bind="nameEn"></span></h2>
    <p class="status"><i></i><span data-bind="status"></span></p>
  </div>
  <dl class="meta" id="meta"></dl>
  <div class="lead">
    <p class="headline kr" data-bind="headline"></p>
    <p class="intro kr" data-bind="intro"></p>
  </div>
  <a class="cue" href="#projects">Scroll</a>
</section>

<div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

<section class="sec" id="projects" data-label="Projects">
  <div class="wrap">
    <header class="sechead"><span class="num"></span><h2>Projects</h2><p class="kr">직접 만들고 매일 쓰는 것들</p></header>
    <div class="cards" id="cards"></div>
  </div>
</section>

<section class="sec" id="vault" data-label="Vault">
  <div class="wrap">
    <header class="sechead"><span class="num"></span><h2>Vault</h2><p class="kr">배포한 사이트 주소는 비밀번호로 잠가 두었습니다</p></header>
    <div class="vault" id="vaultBox">
      <form class="lock" id="lockForm" autocomplete="off">
        <svg class="padlock" viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="21" width="30" height="21" rx="4"/><path d="M15 21v-6a9 9 0 0 1 18 0v6"/><circle cx="24" cy="31" r="2.6"/></svg>
        <label for="vaultPw" class="kr">비밀번호를 입력해 주세요</label>
        <div class="field">
          <input id="vaultPw" type="password" autocomplete="current-password" required />
          <button type="submit" id="vaultGo">Unlock</button>
        </div>
        <p class="err kr" id="vaultErr" role="alert"></p>
        <button type="button" class="bio" id="bioOpen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9v1M15 9v1M12 9v4h-1M9.5 16a3.5 3.5 0 0 0 5 0"/></svg>
          Face ID로 열기
        </button>
        <p class="hint kr">주소는 암호화돼 있어 비밀번호 없이는 이 페이지 소스에서도 보이지 않습니다.</p>
      </form>
      <div class="opened" id="vaultOpen" hidden>
        <div class="links" id="vaultLinks"></div>
        <div class="vbar">
          <button type="button" class="relock" id="bioAdd" hidden>이 기기에서 Face ID로 열기</button>
          <button type="button" class="relock" id="bioDel" hidden>이 기기 Face ID 지우기</button>
          <button type="button" class="relock" id="vaultLock">잠그기</button>
        </div>
        <p class="err kr" id="bioMsg" role="status"></p>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="experience" data-label="Experience" hidden>
  <div class="wrap">
    <header class="sechead"><span class="num"></span><h2>Experience</h2><p class="kr">해 온 일</p></header>
    <ol class="timeline" id="expList"></ol>
  </div>
</section>

<section class="sec" id="awards" data-label="Awards" hidden>
  <div class="wrap">
    <header class="sechead"><span class="num"></span><h2>Awards</h2><p class="kr">무대에 선 것</p></header>
    <div class="withpic"><ol class="timeline" id="awardList"></ol><figure class="pic" id="awardPic" hidden></figure></div>
  </div>
</section>

<section class="sec" id="about" data-label="About">
  <div class="wrap">
    <header class="sechead"><span class="num"></span><h2>About</h2><p class="kr">이런 사람입니다</p></header>
    <div class="about">
      <figure class="pic aboutpic" id="aboutPic" hidden></figure>
      <p class="kr big" data-bind="about"></p>
      <dl class="tmi" id="tmi" hidden></dl>
      <ul class="contact" id="contact"></ul>
    </div>
  </div>
</section>

<footer class="foot"><span>© 2026 KIMJUNHO</span><a href="#intro">Back to top ↑</a></footer>

<nav class="rail" id="rail" aria-label="섹션 이동"></nav>

<dialog class="modal" id="modal">
  <button class="x" type="button" aria-label="닫기" data-close>×</button>
  <div id="modalBody"></div>
</dialog>

</body>
</html>
